name: 🔔 CI Tests

on:
  pull_request:
    branches:
      - main
    paths:
      # - '.github/**'
      - 'src/**'
      - 'package*json'
      - 'action.yaml'
  push:
    branches:
      - main
    paths:
      # - '.github/**'
      - 'src/**'
      - 'package*json'
      - 'action.yaml'
      - '.github/**/test.yaml'
  workflow_dispatch:

permissions:
  contents: read # access to read repository's content
  actions: read # access to reading actions

jobs:
  basic-validation:
    name: Basic Validation
    uses: actions/reusable-workflows/.github/workflows/basic-validation.yml@main
    with:
      operating-systems: '["ubuntu-latest"]'
      enable-audit: false

  test-action:
    name: Test Action (With Matrix)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - repo: null
            description: No repository specified
          - repo: add-to-project
            description: Repository specified by name only
          - repo: stairwaytowonderland/add-to-project
            description: Repository specified by full name

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7

      - name: Get auth token
        id: auth-token
        uses: stairwaytowonderland/actions/.github/actions/auth-token-action@v1
        with:
          # github-token: ${{ secrets.github-token }}
          app-private-key: ${{ secrets.ORG_REPO_USER_PRIVATE_KEY }}
          app-client-id: ${{ vars.ORG_REPO_USER_APP_ID }}

      - name: Test Local Action (${{ matrix.description }})
        id: test
        uses: ./
        with:
          github-token: ${{ steps.auth-token.outputs.token }}
          project-url: https://github.com/orgs/stairwaytowonderland/projects/5
          labeled: dependencies
          dry-run: true
          repo: ${{ matrix.repo }}

      - name: Print Output
        id: output
        run: echo "${{ steps.test.outputs.items }}"
