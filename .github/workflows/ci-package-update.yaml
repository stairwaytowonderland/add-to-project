name: 🔂 CI Package Updates

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: '${{ github.repository_id }}-${{ github.ref_name }}'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package-update:
    name: Update packages
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    uses: stairwaytowonderland/.github/.github/workflows/ci-package-update.yaml@v1
    secrets: inherit
